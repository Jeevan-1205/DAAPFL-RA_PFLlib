output_dir: FedAvg_xBD_LODO

# Experiment
algorithm: FedAvg
dataset: xBD
model: SiameseUNet

# Hardware
device: cuda
device_id: "0"

# Dataset
num_classes: 5
num_clients: 7
protocol: lodo
held_out_idx: 0

# Training
global_rounds: 1
local_epochs: 1
batch_size: 8
local_learning_rate: 0.0001
join_ratio: 1.0
eval_gap: 5

# Optional
learning_rate_decay: false
learning_rate_decay_gamma: 0.99
few_shot: 0